version: 2
updates:
- package-ecosystem: github-actions
  directory: /.github/workflows
  schedule:
    interval: quarterly
  cooldown:
    default-days: 7
  groups:
    gha-patches:
      update-types:
      - patch
- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: quarterly
  cooldown:
    default-days: 7
  groups:
    pre-commit-hooks:
      patterns:
      - '*'
- package-ecosystem: pip
  directory: /
  schedule:
    interval: quarterly
  cooldown:
    default-days: 7
  versioning-strategy: increase-if-necessary
  groups:
    python-deps:
      patterns:
      - '*'
